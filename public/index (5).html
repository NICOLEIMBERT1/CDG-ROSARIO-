<style>

    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --mono:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;
  }
  *{box-sizing:border-box}
  html{scroll-padding-top:12px}
  body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  button,select{font:inherit;color:inherit}

  header{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:center;justify-content:space-between;
    padding:22px 32px;border-bottom:1px solid var(--line)}
  h1{margin:0;font-size:22px;font-weight:700;letter-spacing:-.01em}

  .f select{background:transparent;border:0;font-weight:600;cursor:pointer;padding:2px 4px}

  main{padding:24px 32px 40px}
  .avisos{display:grid;gap:8px;margin-bottom:18px}
  .aviso{border:1px solid #6b3a12;background:#24160a;color:#f5c89b;border-radius:8px;padding:10px 14px;font-size:13px}

  .grid{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:18px;overflow-x:auto;padding-bottom:8px}
  .col{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);
    border-radius:10px;display:flex;flex-direction:column;min-width:0}
  .col-h{padding:16px 16px 14px;text-align:center;border-bottom:1px solid var(--line)}
  .col-h h2{margin:0;font-size:17px;font-weight:700;color:var(--accent)}
  .col-h p{margin:4px 0 0;font-size:11px;color:var(--muted);min-height:14px}
  .blk{padding:18px 16px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;flex:1}
  .blk:last-child{border-bottom:0}
  .lbl{text-align:center;font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .num{text-align:center;font-family:var(--mono);font-weight:700;font-size:30px;letter-spacing:-.02em;line-height:1.1}
  .num small{font-size:.62em;font-weight:700}
  .num.pos{color:var(--pos)} .num.neg{color:var(--neg)}
  .det{display:grid;grid-template-columns:1fr auto;gap:5px 12px;font-family:var(--mono);font-size:12px;margin-top:4px}
  .det .k{color:var(--muted);font-weight:700}
  .det .v{text-align:right;font-weight:700}
  .v.pos{color:var(--pos)} .v.neg{color:var(--neg)} .v.nd{color:#41507a}
  .chip{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11px;
    background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:5px 9px;color:var(--muted)}
  .chip b{color:var(--txt)}
  .final{text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .final b{font-size:13px}

  .estado{padding:60px 20px;text-align:center;color:var(--muted)}
  .estado strong{display:block;color:var(--txt);font-size:16px;margin-bottom:6px}
  footer{padding:0 32px 32px;font-size:12px;color:var(--muted);font-family:var(--mono)}

  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .toolbar label{color:var(--muted);font-size:12px}
  .toolbar select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-weight:600;font-size:13px;cursor:pointer;max-width:100%}
  .toolbar select option{background:var(--panel);color:var(--txt)}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:18px;min-width:0}
  .panel h3{margin:0 0 10px;font-size:14px;font-weight:600}
  .nota{margin:0 0 12px;font-size:12px;color:var(--muted);max-width:80ch;line-height:1.5}
  .vacio{color:var(--muted);font-size:13px}
  .charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-bottom:0}
  @media (max-width:900px){.charts{grid-template-columns:minmax(0,1fr)}}
  .charts .panel{margin-bottom:18px}
  .charts2{display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:18px}
  .ley{display:flex;gap:14px;font-size:11.5px;color:var(--muted);margin-bottom:6px;flex-wrap:wrap}
  .ley i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
  svg{width:100%;height:auto;display:block}
  svg text{fill:#7d8bb0;font-family:var(--mono);font-size:10.5px}
  .scroll{overflow-x:auto}
  .tbl{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:12px}
  .tbl th,.tbl td{padding:7px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
  .tbl th{color:var(--muted);font-weight:600;font-size:11px;background:var(--panel)}
  .tbl th:first-child,.tbl td:first-child{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1}
  .tbl td.tt{font-weight:700}
  .tbl tr.g td{font-weight:700;background:var(--panel-2)}
  .tbl tr.g td:first-child{background:var(--panel-2)}
  .tbl tr.tot td{font-weight:700;background:var(--panel-2)}
  .tbl tr.sub td{color:var(--muted)}
  .tbl td.cat{font-family:var(--sans);font-size:13px}
  .tbl td.cat2{font-family:var(--sans);font-size:12px;padding-left:44px}
  .tbl td small{font-family:var(--mono);color:var(--muted);margin-left:4px}
  .tbl .pos{color:var(--pos)} .tbl .neg{color:var(--neg)}
  .tbl.simple td:first-child,.tbl.simple th:first-child{position:static}
  .exp,.pvx{width:20px;height:20px;border:1px solid var(--line);background:var(--panel-2);color:var(--txt);border-radius:5px;cursor:pointer;margin-right:8px;line-height:1;font-family:var(--mono);padding:0}
  .pvbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin-bottom:12px}
  .pvbar label{color:var(--muted);font-size:12px}
  .pvbar select,.pvbar input[type=search]{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;color:var(--txt)}
  .pvbar input[type=search]{min-width:230px}
  .pvbar button{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:7px 12px;font-size:12px;cursor:pointer}
  .pvbar button:hover{border-color:var(--accent)}
  .pvbar .chk{display:flex;align-items:center;gap:6px;cursor:pointer}
  .tbl tr.pvrow,.tbl tr.exprow,.tbl tr.pvprov,.tbl tr.pgfila{cursor:pointer}
  .tbl tr.pvrow:hover td,.tbl tr.exprow:hover td,.tbl tr.pvprov:hover td{background:var(--panel-2)}
  .tbl tr.pvprov:focus{outline:2px solid var(--accent);outline-offset:-2px}
  .chev{color:var(--muted);margin-left:8px;font-weight:700}
  tr:hover .chev,tr:focus .chev{color:var(--accent)}
  .tbl tr.pgfila.p80 td{background:rgba(242,115,26,.10)}
  .tbl tr.pgfila.p80 td:first-child{background:#26212e}
  .tbl tr.pgfila:hover td,.tbl tr.pgfila:focus td{background:rgba(242,115,26,.22)}
  .tbl tr.pgfila:hover td:first-child,.tbl tr.pgfila:focus td:first-child{background:#412c2b}
  .tbl tr.pgfila:focus{outline:2px solid var(--accent);outline-offset:-2px}
  .tbl td.cat,.tbl td.cat2{text-align:left}
  .tbl.pg th:nth-child(1),.tbl.pg th:nth-child(3),.tbl.pg th:nth-child(5),.tbl.pgd th:nth-child(-n+3){text-align:left}
  .tbl.pg td:nth-child(4),.tbl.pg td:nth-child(9),.tbl.pg th:nth-child(4),.tbl.pg th:nth-child(9){text-align:center}
  .tbl.pg td:nth-child(3),.tbl.pg td:nth-child(5){white-space:normal;min-width:150px;max-width:260px}
  .tbl.pgd td.cat{white-space:normal}
  .tbl tr.pgfila.corte td{border-top:2px solid var(--txt)}
  .tbl tr.sel td,.tbl tr.sel td:first-child{background:#412c2b}
  .tbl.pgd td:first-child,.tbl.pgd th:first-child{position:static}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{background:var(--panel-2);color:var(--muted);border:0;padding:7px 16px;font-size:13px;cursor:pointer;font-weight:600}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button[aria-pressed="true"]{background:var(--accent);color:#1a0d02}
  .tbl tr.ndfila{cursor:pointer}
  .tbl tr.ndfila:hover td{background:var(--panel-2)}
  .tbl tr.ndfila.abierto td{background:#241e2c}
  .tbl tr.ndfila.resto td{color:var(--muted)}
  .tbl tr.ndfac td{background:#0b1226;padding:10px 12px 14px 34px;white-space:normal}
  .tbl.fac{font-size:11.5px}
  .tbl.fac td,.tbl.fac th{padding:4px 10px}
  .tbl tr.pvnodo{cursor:pointer}
  .tbl tr.pvnodo:hover td{background:var(--panel-2)}
  .dbk{position:fixed;inset:0;background:rgba(2,6,16,.6);z-index:44}
  .dbk[hidden],.drawer[hidden]{display:none}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(980px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:45;overflow:auto;padding:22px;box-shadow:-14px 0 34px rgba(0,0,0,.5)}
  .dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
  .dh small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
  .dh h2{margin:4px 0 0;font-size:18px;line-height:1.3;word-break:break-word}
  .dx{flex:none;width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--txt);font-size:22px;line-height:1;cursor:pointer}
  .dx:hover{border-color:var(--accent)}
  .kpi small{font-size:11px;color:var(--muted);font-weight:400;display:block;margin-top:4px;font-family:var(--sans)}
  .kpi b small{display:inline;font-size:13px;margin:0}
  .kpis.dk{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .dk .kpi{padding:12px}.dk .kpi b{font-size:18px}
  .parbar{cursor:pointer}
  .parbar:hover{opacity:.8}
  .resumen-par{margin:0 0 6px;font-size:13px}
  .resumen-par b{font-family:var(--mono)}
  .tbl tr.n0 td:first-child{font-weight:600}
  .tbl tr.n2 td{color:var(--muted)}
  .pvtope{max-height:620px;overflow:auto}
  .exp-sp{display:inline-block;width:28px}
  .bar{display:inline-block;width:70px;height:6px;background:var(--panel-2);border-radius:3px;margin-right:8px;vertical-align:middle;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent)}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-bottom:18px}
  .kpi{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:10px;padding:16px;text-align:center}
  .kpi span{display:block;font-size:11px;color:var(--muted);margin-bottom:8px}
  .kpi b{font-family:var(--mono);font-size:26px}

  /* ---------- Panel lateral ---------- */
  :root{--rail:60px;--wide:240px}
  .shell{margin-left:var(--rail);min-height:100vh;transition:margin-left .22s ease}
  .shell.nosb{margin-left:0}
  .sb{position:fixed;inset:0 auto 0 0;width:var(--rail);z-index:40;transition:width .22s ease,transform .22s ease}
  .sb[hidden]{display:none}
  .sb-in{height:100%;overflow:hidden auto;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:12px 8px;scrollbar-width:none}
  .sb-in::-webkit-scrollbar{display:none}
  .sb:not(.hidden):hover,.sb:not(.hidden):focus-within{width:var(--wide)}
  .sb:not(.hidden):hover .sb-in,.sb:not(.hidden):focus-within .sb-in{box-shadow:10px 0 28px rgba(0,0,0,.4)}
  .sb.hidden{transform:translateX(-100%)}
  .sb.hidden .sb-in{pointer-events:none;visibility:hidden}
  .sb-brand{display:flex;align-items:center;gap:12px;height:44px;padding:0 6px;margin-bottom:6px;white-space:nowrap}
  .sb-brand .mark{flex:none;width:32px;height:32px;border-radius:8px;background:var(--accent);color:#1a0d02;display:grid;place-items:center;font:700 12px var(--mono)}
  .sb-brand .lb{display:flex;flex-direction:column;line-height:1.2;font-weight:700;font-size:14px}
  .sb-brand .lb small{font-weight:400;font-size:11px;color:var(--muted)}
  .lb{opacity:0;transition:opacity .15s ease;white-space:nowrap;overflow:hidden}
  .sb:not(.hidden):hover .lb,.sb:not(.hidden):focus-within .lb{opacity:1}
  .sb-items{display:flex;flex-direction:column;gap:2px}
  .sb-item{display:flex;align-items:center;gap:14px;width:100%;height:42px;padding:0 12px;border:0;background:none;border-radius:8px;color:var(--muted);cursor:pointer;text-align:left;position:relative;font-size:14px;font-weight:500}
  .sb-item .ic{flex:none;width:20px;height:20px}
  .sb-item:hover{background:var(--panel-2);color:var(--txt)}
  .sb-item[aria-current="page"]{background:var(--panel-2);color:var(--txt);font-weight:600}
  .sb-item[aria-current="page"]::before{content:"";position:absolute;left:-8px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
  .sb-item[aria-current="page"] .ic{color:var(--accent)}
  .sb-sec{display:flex;align-items:center;height:22px;padding:0 12px;margin-top:10px;font-size:10px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#4d5c86;white-space:nowrap;overflow:hidden}
  .sb-sec::after{content:"";flex:1;height:1px;background:var(--line)}
  .sb-sec span{max-width:0;opacity:0;margin-right:0;overflow:hidden;transition:max-width .22s ease,opacity .15s ease,margin .22s ease}
  .sb:not(.hidden):hover .sb-sec span,.sb:not(.hidden):focus-within .sb-sec span{max-width:140px;opacity:1;margin-right:10px}
  .sb-toggle{position:absolute;top:68px;right:-13px;width:26px;height:26px;padding:0;border-radius:50%;border:1px solid var(--line);background:var(--panel-2);color:var(--txt);cursor:pointer;display:grid;place-items:center;z-index:2;transition:background .15s}
  .sb-toggle:hover{background:var(--accent);color:#1a0d02;border-color:var(--accent)}
  .sb-toggle svg{width:14px;height:14px;transition:transform .22s ease}
  .sb.hidden .sb-toggle{right:-30px;top:76px;width:30px;height:46px;border-radius:0 10px 10px 0;border-left:0}
  .sb.hidden .sb-toggle svg{transform:rotate(180deg)}
  .sb-backdrop{position:fixed;inset:0;background:rgba(2,6,16,.6);z-index:30}
  .sb-backdrop[hidden]{display:none}
  @media (prefers-reduced-motion:reduce){.sb,.shell,.lb,.sb-sec span,.sb-toggle svg{transition:none}}
  @media (max-width:760px){
    :root{--rail:0px}
    .sb{width:var(--wide)}
    .sb:not(.hidden) .lb{opacity:1}
    .sb:not(.hidden) .sb-sec span{max-width:140px;opacity:1;margin-right:10px}
    .sb:not(.hidden) .sb-in{box-shadow:10px 0 28px rgba(0,0,0,.5)}
  }

  @media (max-width:640px){
    header,main{padding-left:16px;padding-right:16px}
    footer{padding:0 16px 28px}
    .num{font-size:26px}
    .grid{grid-auto-columns:minmax(240px,86%)}
  }
</style>
</head>

<script>
const MESES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const ORDEN=['Casino','Casino Online','Hotel','AA&BB','Parking','Otros Negocios'];
const CAMPOS=['ingresos','costos_fijos','costos_variables','personal','costos','ebitda','estructura','ebitda_final'];
const S={anio:null,desde:1,hasta:12,tab:'Resumen'};
let D=null;

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clave=(a,m)=>`${a}-${String(m).padStart(2,'0')}`;
const vacio=()=>Object.fromEntries(CAMPOS.map(c=>[c,0]));
const sumar=(a,b)=>{for(const c of CAMPOS)a[c]+=(b&&b[c])||0;return a};

/* ---------- formato ---------- */
function fM(v){const m=v/1e6,d=Math.abs(m)>=10?0:1;
  return m.toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d})+' M'}
const fP=v=>v.toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%';
const signo=(t,v)=>(v>0?'+':'')+t;

/* ---------- datos ---------- */
const mesesDe=(fuente,anio)=>Object.keys(fuente||{}).filter(k=>k.startsWith(anio+'-')).map(k=>+k.slice(5)).sort((a,b)=>a-b);
const anios=()=>[...new Set(Object.keys(D.meses).map(k=>+k.slice(0,4)))].sort((a,b)=>b-a);

function agregar(col,fuente,anio,ms){
  const acc=vacio();
  for(const m of ms){
    const r=fuente&&fuente[clave(anio,m)]&&fuente[clave(anio,m)].resultado;
    if(!r)return null;               // comparativo incompleto: no se muestra
    sumar(acc,col.get(r));
  }
  return acc;
}
function unidadesPresentes(){
  const set=new Set();
  for(const m of mesesDe(D.meses,S.anio))Object.keys(D.meses[clave(S.anio,m)].resultado).forEach(u=>set.add(u));
  return ORDEN.filter(u=>set.has(u)).concat([...set].filter(u=>!ORDEN.includes(u)));
}
function columnas(){
  const pres=unidadesPresentes();
  if(S.tab==='Resumen'){
    const cols=[{titulo:'Total unidades',sub:'Suma de las unidades de negocio',total:true,
      get:r=>{const a=vacio();for(const u of Object.keys(r))sumar(a,r[u].total);return a}}];
    for(const u of pres)cols.push({titulo:u==='Casino'?'Casino Total':u,sub:u==='Casino'?'Slots, Mesas, Poker y Bingo':'',get:r=>r[u]&&r[u].total});
    return {cols,base:cols[0]};
  }
  const subs=new Set();
  for(const m of mesesDe(D.meses,S.anio)){
    const u=D.meses[clave(S.anio,m)].resultado[S.tab];
    if(u)Object.keys(u.subunidades).forEach(s=>subs.add(s));
  }
  const orden=S.tab==='Casino'?['Slots','Mesas','Poker','Bingo']:[...subs].sort();
  const total={titulo:S.tab==='Casino'?'Casino Total':S.tab+' – Total',sub:S.tab==='Casino'?'Slots, Mesas, Poker y Bingo':'',total:true,get:r=>r[S.tab]&&r[S.tab].total};
  const cols=[total];
  for(const s of orden.filter(x=>subs.has(x)))cols.push({titulo:s,sub:'',get:r=>r[S.tab]&&r[S.tab].subunidades[s]});
  return {cols,base:total};
}

/* ---------- comparativos ---------- */
const pct=(a,b)=>b?((a-b)/Math.abs(b))*100:null;
const marg=x=>x.ingresos?x.ebitda/x.ingresos*100:null;
function fila(k,txt,clase){return `<span class="k">${k}</span><span class="v ${clase||''}">${txt}</span>`}
function dPct(a,b,malo){            // variación % ; malo=true: subir es malo (costos)
  if(!b)return '<span class="v nd">—</span>';
  const p=pct(a,b); if(p===null)return '—';
  const bueno=malo?p<0:p>0; const c=Math.abs(p)<.05?'':(bueno?'pos':'neg');
  return `<span class="v ${c}">${signo(fP(p),p)}</span>`;
}
function cmp(etq,a,b,campo,malo){
  const v=(!b)?'<span class="v nd">—</span>':dPct(a[campo],b[campo],malo);
  return `<span class="k">${etq}</span>${v}`;
}
function cmpPP(etq,a,b){
  if(!b||marg(b)===null||marg(a)===null)return `<span class="k">${etq}</span><span class="v nd">—</span>`;
  const d=marg(a)-marg(b),c=Math.abs(d)<.05?'':(d>0?'pos':'neg');
  return `<span class="k">${etq}</span><span class="v ${c}">${signo(d.toLocaleString('es-AR',{minimumFractionDigits:1,maximumFractionDigits:1}),d)} pp</span>`;
}

/* ---------- render ---------- */
function render(){
  cerrarDetalle();
  $('sub').textContent='City Center Rosario · '+S.anio+' · '+(S.tab==='Casino'?'Casino':S.tab);
  const ms=mesesDe(D.meses,S.anio).filter(m=>m>=S.desde&&m<=S.hasta);
  const cont=$('contenido');
  if(!ms.length){cont.innerHTML='<div class="estado"><strong>Sin datos en el período</strong>Elegí otro rango de meses.</div>';avisos([]);return}
  if(ANALISIS.includes(S.tab)){cont.innerHTML=renderAnalisis(ms);avisos(ms);return}
  const {cols,base}=columnas();
  const baseAct=agregar(base,D.meses,S.anio,ms);
  const html=cols.map(col=>{
    const a=agregar(col,D.meses,S.anio,ms)||vacio();
    const py=agregar(col,D.meses,S.anio-1,ms);           // mismo período del año anterior
    const fc=agregar(col,D.forecast,S.anio,ms);          // forecast, si fue cargado
    const sh=(!col.total&&baseAct&&baseAct.ingresos)?a.ingresos/baseAct.ingresos*100:null;
    const m=marg(a), mFinal=a.ingresos?a.ebitda_final/a.ingresos*100:null;
    const ing=`<div class="blk"><div class="lbl">Ingresos</div><div class="num">${fM(a.ingresos).replace(' M','<small> M</small>')}</div>
      <div class="det">${cmp('vs Fc',a,fc,'ingresos',false)}${cmp('vs '+String(S.anio-1).slice(2),a,py,'ingresos',false)}
      ${sh===null?'':`<span class="k">%Tot</span><span class="v">${fP(sh)}</span>`}</div></div>`;
    const bloque=(tit,campo)=>`<div class="blk"><div class="lbl">${tit}</div><div class="num">${fM(a[campo]).replace(' M','<small> M</small>')}</div>
      <div class="det">${cmp('vs Fc',a,fc,campo,true)}${cmp('vs '+String(S.anio-1).slice(2),a,py,campo,true)}
      <span class="k">%Ing</span><span class="v">${a.ingresos?fP(a[campo]/a.ingresos*100):'—'}</span></div></div>`;
    const cls=a.ebitda>0?'pos':(a.ebitda<0?'neg':'');
    const est=Math.abs(a.estructura)>0.5;
    const ebitda=`<div class="blk"><div class="lbl">EBITDA</div><div class="num ${cls}">${fM(a.ebitda).replace(' M','<small> M</small>')}</div>
      ${est?`<div class="chip"><span>Estructura</span><b>−${fM(a.estructura)}</b></div>
      <div class="final">EBITDA final <b>${fM(a.ebitda_final)}</b> (${mFinal===null?'—':fP(mFinal)})</div>`:''}
      <div class="det">${cmpPP('vs Fc',a,fc)}${cmpPP('vs '+String(S.anio-1).slice(2),a,py)}
      <span class="k">Margen</span><span class="v ${m===null?'':(m>=0?'pos':'neg')}">${m===null?'—':fP(m)}</span></div></div>`;
    return `<section class="col"><div class="col-h"><h2>${esc(col.titulo)}</h2><p>${esc(col.sub||'')}</p></div>
      ${ing}${bloque('Costos fijos y variables','costos')}${bloque('Gasto de personal','personal')}${ebitda}</section>`;
  }).join('');
  cont.innerHTML=`<div class="grid">${html}</div>`;
  avisos(ms);
}

function avisos(ms){
  const out=[];let lin=0,res=0,cecos=new Set(),nomap=0,imp=0,adv=[];
  for(const m of ms){
    const c=(D.meses[clave(S.anio,m)]||{}).controles;if(!c)continue;
    if(c.sin_asignar&&c.sin_asignar.lineas){lin+=c.sin_asignar.lineas;res+=c.sin_asignar.resultado;c.sin_asignar.ceco.forEach(x=>cecos.add(x))}
    if(c.cuentas_sin_mapeo){nomap+=c.cuentas_sin_mapeo.lineas;imp+=c.cuentas_sin_mapeo.importe_sap}
    if(c.conciliacion&&Math.abs(c.conciliacion.diferencia)>1)adv.push(MESES[m-1]);
  }
  if(lin)out.push(`Centros sin unidad asignada (${[...cecos].join(', ')}): ${fM(res)} de resultado no está incluido en las unidades.`);
  if(nomap)out.push(`${nomap} asientos con cuentas sin mapear quedaron fuera del resultado (importe neto: ${Math.abs(imp)<5e5?'0 M':fM(imp)}).`);
  if(adv.length)out.push(`La conciliación no cierra en: ${adv.join(', ')}.`);
  $('avisos').innerHTML=out.map(t=>`<div class="aviso">${esc(t)}</div>`).join('');
}

/* ====================== ANÁLISIS ====================== */
const ANALISIS=['Evolución','Rubros','Gerencias','Estructura','Pareto'];
const ACR=/\b(iae|ccss|sac|tgi|drei|etur|aa&bb|ett|rrhh)\b/gi;
const TILDES={maquinas:'máquinas',participacion:'participación',reparacion:'reparación',gastronomia:'gastronomía',gravamenes:'gravámenes',camara:'cámara',debitos:'débitos',creditos:'créditos',tecnica:'técnica',tecnicas:'técnicas',comunicacion:'comunicación',comunicaciones:'comunicaciones',alquileres:'alquileres',cortesias:'cortesías',indemnizaciones:'indemnizaciones',hosteleria:'hostelería',operacion:'operación',administracion:'administración'};
const bonito=s=>{let t=String(s||'').toLowerCase().replace(/[a-záéíóúñ&]+/g,w=>TILDES[w]||w);return (t.charAt(0).toUpperCase()+t.slice(1)).replace(ACR,x=>x.toUpperCase())};
const suma=a=>a.reduce((x,y)=>x+y,0);
const fN=v=>{const m=v/1e6,d=Math.abs(m)>=10?0:1;return m.toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d})};
const mil=v=>(v/1e6).toLocaleString('es-AR',{maximumFractionDigits:0});
S.ambito='*';S.gConc='total';S.exp=new Set();

function sumUnits(r){const a=vacio();for(const u of Object.keys(r))sumar(a,r[u].total);return a}
function ambitos(){
  const out=[{id:'*',label:'Total unidades',u:null,s:null,get:sumUnits}];
  for(const u of unidadesPresentes()){
    out.push({id:u+'|',label:u==='Casino'?'Casino Total':u+' – total',u,s:null,get:r=>r[u]&&r[u].total});
    const subs=new Set();
    for(const m of mesesDe(D.meses,S.anio)){const x=D.meses[clave(S.anio,m)].resultado[u];if(x)Object.keys(x.subunidades).forEach(s=>subs.add(s))}
    const orden=u==='Casino'?['Slots','Mesas','Poker','Bingo']:[...subs].sort();
    for(const s of orden.filter(x=>subs.has(x)))out.push({id:u+'|'+s,label:u+' › '+s,u,s,get:r=>r[u]&&r[u].subunidades[s]});
  }
  return out;
}
const ambitoActual=()=>{const l=ambitos();return l.find(a=>a.id===S.ambito)||l[0]};
function selAmbito(){
  const l=ambitos(),act=ambitoActual();
  return `<div class="toolbar"><label for="ambito">Ver</label><select id="ambito">${l.map(a=>`<option value="${esc(a.id)}"${a.id===act.id?' selected':''}>${esc(a.label)}</option>`).join('')}</select></div>`;
}

/* ---------- gráficos SVG ---------- */
function ticks(min,max,n=4){
  const span=(max-min)||1,raw=span/n,mag=Math.pow(10,Math.floor(Math.log10(raw))),f=raw/mag;
  const step=(f<=1?1:f<=2?2:f<=5?5:10)*mag,lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step,t=[];
  for(let v=lo;v<=hi+step/1e6;v+=step)t.push(v);
  return t;
}
function marco(titulo,series,svg){
  const ley=series.length>1?`<div class="ley">${series.map(s=>`<span><i style="background:${s.c}"></i>${esc(s.n)}</span>`).join('')}</div>`:'';
  return `<div class="panel"><h3>${esc(titulo)}</h3>${ley}${svg}</div>`;
}
function chartBarras({titulo,etq,series,pct}){
  const W=520,H=230,L=pct?44:54,R=10,T=12,B=26;
  const vals=series.flatMap(s=>s.v).filter(v=>v!==null);
  const tk=ticks(Math.min(0,...vals),Math.max(0,...vals)),lo=tk[0],hi=tk[tk.length-1];
  const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo)),band=(W-L-R)/etq.length,bw=Math.min(30,band*.78/series.length);
  let g=tk.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="${t===0?'#41507a':'#1b2a4f'}"/><text x="${L-6}" y="${y(t)+3}" text-anchor="end">${pct?t.toLocaleString('es-AR')+'%':mil(t)}</text>`).join('');
  etq.forEach((e,i)=>{
    const cx=L+band*i+band/2;
    series.forEach((s,k)=>{
      const v=s.v[i];if(v===null)return;
      const x=cx-bw*series.length/2+bw*k,y0=y(0),y1=y(v);
      g+=`<rect x="${x.toFixed(1)}" y="${Math.min(y0,y1).toFixed(1)}" width="${(bw-2).toFixed(1)}" height="${Math.max(1,Math.abs(y1-y0)).toFixed(1)}" rx="2" fill="${s.c}"><title>${e} · ${s.n}: ${pct?v.toLocaleString('es-AR',{maximumFractionDigits:1})+'%':fM(v)}</title></rect>`;
    });
    g+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${e}</text>`;
  });
  return marco(titulo,series,`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(titulo)}">${g}</svg>`);
}
function chartLinea({titulo,etq,series}){
  const W=520,H=230,L=44,R=14,T=12,B=26;
  const vals=series.flatMap(s=>s.v).filter(v=>v!==null);
  if(!vals.length)return marco(titulo,series,'<p class="vacio">Sin datos</p>');
  const tk=ticks(Math.min(0,...vals),Math.max(0,...vals)),lo=tk[0],hi=tk[tk.length-1];
  const y=v=>T+(H-T-B)*(1-(v-lo)/(hi-lo)),band=(W-L-R)/etq.length,xs=i=>L+band*i+band/2;
  let g=tk.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="${t===0?'#41507a':'#1b2a4f'}"/><text x="${L-6}" y="${y(t)+3}" text-anchor="end">${t.toLocaleString('es-AR')}%</text>`).join('');
  etq.forEach((e,i)=>{g+=`<text x="${xs(i)}" y="${H-8}" text-anchor="middle">${e}</text>`});
  for(const s of series){
    let d='',pen=false;
    s.v.forEach((v,i)=>{if(v===null){pen=false;return}d+=(pen?'L':'M')+xs(i).toFixed(1)+' '+y(v).toFixed(1)+' ';pen=true});
    g+=`<path d="${d}" fill="none" stroke="${s.c}" stroke-width="2.2" stroke-linejoin="round"/>`;
    s.v.forEach((v,i)=>{if(v!==null)g+=`<circle cx="${xs(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="3.2" fill="${s.c}"><title>${etq[i]} · ${s.n}: ${v.toLocaleString('es-AR',{maximumFractionDigits:1})}%</title></circle>`});
  }
  return marco(titulo,series,`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(titulo)}">${g}</svg>`);
}

/* ---------- Rubros ---------- */
function renderRubros(ms){
  const amb=ambitoActual();let falta=false;
  const G={I:{},C:{},P:{}},tot={I:{},C:{},P:{}};
  for(const m of ms){
    const det=D.meses[clave(S.anio,m)].detalle;if(!det){falta=true;continue}
    for(const [u,s,t,c,sc,imp] of det.rubros){
      if(amb.u&&u!==amb.u)continue;if(amb.s&&s!==amb.s)continue;
      const g=t==='I'?'I':(c==='GASTO DE PERSONAL'?'P':'C');
      const cat=G[g][c]||(G[g][c]={tot:0,m:{},subs:{}});
      cat.tot+=imp;cat.m[m]=(cat.m[m]||0)+imp;
      const sb=cat.subs[sc]||(cat.subs[sc]={tot:0,m:{}});
      sb.tot+=imp;sb.m[m]=(sb.m[m]||0)+imp;
      tot[g][m]=(tot[g][m]||0)+imp;
    }
  }
  if(falta)return selAmbito()+faltaDetalle;
  const sg=g=>suma(ms.map(m=>tot[g][m]||0)),ing=sg('I');
  const celdas=(mm,t,cls)=>ms.map(m=>`<td>${mm[m]?fN(mm[m]):'–'}</td>`).join('')+`<td class="tt ${cls||''}">${fN(t)}</td><td>${ing?fP(t/ing*100):'–'}</td>`;
  const grupo=(nombre,g)=>{
    let h=`<tr class="g"><td>${nombre}</td>${celdas(tot[g],sg(g))}</tr>`;
    const cats=Object.entries(G[g]).sort((a,b)=>Math.abs(b[1].tot)-Math.abs(a[1].tot));
    for(const [c,o] of cats){
      const subs=Object.entries(o.subs).sort((a,b)=>Math.abs(b[1].tot)-Math.abs(a[1].tot));
      if(g==='P'&&cats.length===1){for(const [sc,so] of subs)h+=`<tr><td class="cat"><span class="exp-sp"></span>${esc(bonito(sc))}</td>${celdas(so.m,so.tot)}</tr>`;continue}
      const abre=subs.length>1,k=g+'|'+c,open=S.exp.has(k);
      h+=`<tr${abre?` class="exprow" data-k="${esc(k)}"`:''}><td class="cat">${abre?`<button class="exp" data-k="${esc(k)}" aria-expanded="${open}" aria-label="Ver detalle de ${esc(bonito(c))}">${open?'−':'+'}</button>`:'<span class="exp-sp"></span>'}${esc(bonito(c))}</td>${celdas(o.m,o.tot)}</tr>`;
      if(abre&&open)for(const [sc,so] of subs)h+=`<tr class="sub"><td class="cat2">${esc(bonito(sc))}</td>${celdas(so.m,so.tot)}</tr>`;
    }
    return h;
  };
  const e={};ms.forEach(m=>{e[m]=(tot.I[m]||0)-(tot.C[m]||0)-(tot.P[m]||0)});
  const et=suma(Object.values(e));
  const cab=`<tr><th>Concepto (millones de $)</th>${ms.map(m=>`<th>${MESES[m-1]}</th>`).join('')}<th>Total</th><th>% ing.</th></tr>`;
  const cuerpo=grupo('Ingresos','I')+grupo('Costos fijos y variables','C')+grupo('Gasto de personal','P')+
    `<tr class="g eb"><td>EBITDA (antes de estructura)</td>${celdas(e,et,et>=0?'pos':'neg')}</tr>`;
  return selAmbito()+`<div class="panel"><h3>Detalle por rubro</h3><p class="nota">Tocá + para ver el desglose de cada rubro. Incluye la parte del Casino genérico que se reparte a Slots y Mesas; la Estructura se ve en su pestaña.</p><div class="scroll"><table class="tbl rub"><thead>${cab}</thead><tbody>${cuerpo}</tbody></table></div></div>`;
}

/* ---------- Gerencias ---------- */
function renderGerencias(ms){
  const mat={};let falta=false;

  const cab=`<tr><th>Gerencia</th>${orden.map(k=>`<th>${esc(k)}</th>`).join('')}<th>Total</th><th>% del total</th></tr>`;
  const cuerpo=filas.map(f=>`<tr><td class="cat">${esc(nombres[f.g]||f.g)} <small>${esc(f.g)}</small></td>${orden.map(k=>{const v=f.o[k]?val(f.o[k]):0;return `<td${v?` style="background:rgba(242,115,26,${Math.min(.5,Math.abs(v)/mx*.5).toFixed(2)})"`:''}>${v?fN(v):'–'}</td>`}).join('')}<td class="tt">${fN(f.t)}</td><td><span class="bar"><i style="width:${T?Math.max(0,Math.min(100,f.t/T*100)).toFixed(1):0}%"></i></span>${T?fP(f.t/T*100):'–'}</td></tr>`).join('');

  return sel+`<div class="panel"><h3>Costos por gerencia (millones de $)</h3><p class="nota">La gerencia es quien gestiona el gasto. Las columnas son la unidad o el centro donde se imputa. "Casino genérico" y "Estructura" se muestran antes de repartirse.</p><div class="scroll"><table class="tbl ger"><thead>${cab}</thead><tbody>${cuerpo}${pie}</tbody></table></div></div>`;
}

/* ---------- Pareto de la Estructura ---------- */
S.pareto='rubro';S.parRubro='*';
function paretoItems(ms){
  const acum=new Map();let sinProv=0;
  if(S.pareto==='rubro'){
    for(const m of ms){const det=D.meses[clave(S.anio,m)].detalle;if(!det)continue;
      for(const [c,ch,v] of det.estructura.por_rubro)acum.set(c,(acum.get(c)||0)+v)}
  }else{
    for(const m of ms)for(const r of (PROV.meses[clave(S.anio,m)]||[])){
      if(S.parRubro!=='*'&&r[1]!==S.parRubro)continue;
      if(r[3].startsWith('Sin proveedor')){sinProv+=r[4];continue}
      acum.set(r[3],(acum.get(r[3])||0)+r[4]);
    }
  }
  const items=[];let neg=0;
  for(const [k,v] of acum){if(v>0.5)items.push({k,v});else neg+=v}
  items.sort((a,b)=>b.v-a.v);
  return {items,neg,sinProv};
}
function chartPareto(items,porRubro){
  const N=15,top=items.slice(0,N),resto=items.slice(N),base=suma(items.map(i=>i.v));
  const data=top.map(i=>({n:porRubro?bonito(i.k):i.k,v:i.v,k:i.k}));
  if(resto.length)data.push({n:'Resto ('+resto.length+')',v:suma(resto.map(i=>i.v)),k:null,resto:true});
  let acc=0;data.forEach(d=>{acc+=d.v;d.c=acc/base*100});
  let idx80=data.findIndex(d=>d.c>=80);if(idx80<0)idx80=data.length-1;
  const W=1000,H=380,L=62,R=54,T=18,B=118,ph=H-T-B;
  const tk=ticks(0,data[0].v),hi=tk[tk.length-1];
  const y=v=>T+ph*(1-v/hi),yR=p=>T+ph*(1-p/100),band=(W-L-R)/data.length,bw=Math.min(46,band*.7);
  let g=tk.map(t=>`<line x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}" stroke="#1b2a4f"/><text x="${L-8}" y="${y(t)+3}" text-anchor="end">${mil(t)}</text>`).join('');
  for(const q of [0,20,40,60,80,100])g+=`<text x="${W-R+8}" y="${yR(q)+3}">${q}%</text>`;
  g+=`<line x1="${L}" x2="${W-R}" y1="${yR(80)}" y2="${yR(80)}" stroke="#7d8bb0" stroke-dasharray="5 5"/>`;
  let linea='';
  data.forEach((d,i)=>{
    const cx=L+band*i+band/2,col=d.resto?'#2a3a66':(i<=idx80?'#f2731a':'#41507a');
    const tip=`${d.n}: ${fM(d.v)} · ${fP(d.v/base*100)} del total · acumulado ${fP(d.c)}`;
    g+=`<rect class="${porRubro&&d.k?'parbar':''}" ${porRubro&&d.k?`data-k="${esc(d.k)}" `:''}x="${(cx-bw/2).toFixed(1)}" y="${y(d.v).toFixed(1)}" width="${bw.toFixed(1)}" height="${Math.max(1,y(0)-y(d.v)).toFixed(1)}" rx="2" fill="${col}"><title>${esc(tip)}</title></rect>`;
    const et=d.n.length>24?d.n.slice(0,23)+'…':d.n;
    g+=`<text transform="translate(${cx.toFixed(1)} ${H-B+14}) rotate(-38)" text-anchor="end">${esc(et)}</text>`;
    linea+=(i?'L':'M')+cx.toFixed(1)+' '+yR(d.c).toFixed(1)+' ';
  });
  g+=`<path d="${linea}" fill="none" stroke="#5b8def" stroke-width="2.4" stroke-linejoin="round"/>`;
  data.forEach((d,i)=>{const cx=L+band*i+band/2;g+=`<circle cx="${cx.toFixed(1)}" cy="${yR(d.c).toFixed(1)}" r="3.6" fill="#5b8def"><title>${esc(d.n)}: acumulado ${fP(d.c)}</title></circle>`});
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de Pareto">${g}</svg>`;
}
function renderPareto(ms){
  const prov=S.pareto==='proveedor';
  const rub=new Map();
  for(const m of ms){const det=D.meses[clave(S.anio,m)].detalle;if(det)for(const [c,ch,v] of det.estructura.por_rubro)rub.set(c,(rub.get(c)||0)+v)}
  const rubros=[...rub.entries()].filter(([,v])=>v>0.5).sort((a,b)=>b[1]-a[1]).map(([k])=>k);

  const titulo='Pareto de la Estructura por '+(prov?'proveedor'+(S.parRubro!=='*'?' · '+bonito(S.parRubro):''):'rubro');

  else{
    const {items,neg,sinProv}=paretoItems(ms);
    if(!items.length)cuerpo='<p class="vacio">No hay importes positivos para mostrar.</p>';
    else{
      const base=suma(items.map(i=>i.v));let a=0,n80=0;
      for(const i of items){a+=i.v;n80++;if(a/base>=.8)break}
      const unidad=prov?'proveedores':'rubros';
      const notas=[];
      if(Math.abs(neg)>5e5)notas.push(`No incluye ${fM(Math.abs(neg))} de importes netos negativos (ajustes o créditos).`);
      if(prov&&Math.abs(sinProv)>5e5)notas.push(`No incluye los asientos sin proveedor (neto ${fM(sinProv)}).`);
      if(!prov)notas.push('Tocá una barra para ver los proveedores de ese rubro.');
      cuerpo=`<p class="resumen-par"><b>${n80}</b> de ${items.length} ${unidad} explican el <b>80%</b> (${fM(a)} de ${fM(base)}).</p>

        ${chartPareto(items,!prov)}<p class="nota" style="margin:8px 0 0">${notas.join(' ')}</p>`;
    }
  }
  return `<div class="panel"><h3>${esc(titulo)}</h3>${sel}${cuerpo}</div>`;
}

function renderEstructura(ms){

    const e=det.estructura;total+=e.total;
    for(const [c,ch,v] of e.por_rubro){const k=c+'|'+ch;rub[k]=(rub[k]||0)+v}
    for(const [k,v] of Object.entries(e.por_gerencia))ger[k]=(ger[k]||0)+v;
    for(const [k,v] of Object.entries(e.por_centro))cen[k]=(cen[k]||0)+v;
    for(const [s,[b,mo]] of Object.entries(e.reparto)){base[s]=(base[s]||0)+b;monto[s]=(monto[s]||0)+mo}
    gen+=det.generico.total;for(const [s,v] of Object.entries(det.generico.reparto))genRep[s]=(genRep[s]||0)+v;
    const c=D.meses[clave(S.anio,m)].resultado.Casino;
    porMes.push({m,est:e.total,ing:c?c.total.ingresos:0});
  }
  if(falta)return faltaDetalle;
  const ingC=suma(porMes.map(x=>x.ing)),bT=suma(Object.values(base));
  const lista=(obj,fmt)=>{const a=Object.entries(obj).filter(([,v])=>Math.abs(v)>0.5).sort((x,y)=>y[1]-x[1]);
    return a.map(([k,v])=>`<tr><td class="cat">${esc(fmt(k))}</td><td>${fN(v)}</td><td><span class="bar"><i style="width:${total?Math.max(0,Math.min(100,v/total*100)).toFixed(1):0}%"></i></span>${total?fP(v/total*100):'–'}</td></tr>`).join('')};
  const tablaSimple=(tit,obj,fmt,nota)=>`<div class="panel"><h3>${tit}</h3>${nota?`<p class="nota">${nota}</p>`:''}<table class="tbl simple"><thead><tr><th>Concepto</th><th>Millones de $</th><th>% de la Estructura</th></tr></thead><tbody>${lista(obj,fmt)}</tbody></table></div>`;
  const nombres=(D.meta&&D.meta.gerencias)||{};
  const centros={'90000':'Estructura – genérico (90000)','90001':'Estructura – corporativa (90001)'};
  const kpis=`<div class="kpis"><div class="kpi"><span>Estructura del período</span><b>${fM(total)}</b></div><div class="kpi"><span>% de los ingresos del Casino</span><b>${ingC?fP(total/ingC*100):'–'}</b></div><div class="kpi"><span>Promedio mensual</span><b>${ms.length?fM(total/ms.length):'–'}</b></div></div>`;
  const filasR=['Slots','Mesas','Poker','Bingo'].filter(s=>s in base).map(s=>{
    const a=agregar({get:r=>r.Casino&&r.Casino.subunidades[s]},D.meses,S.anio,ms)||vacio();
    return `<tr><td class="cat">${s}</td><td>${fN(base[s])}</td><td>${bT?fP(base[s]/bT*100):'–'}</td><td class="tt">${fN(monto[s])}</td><td>${total?fP(monto[s]/total*100):'–'}</td><td class="${a.ebitda>=0?'pos':'neg'}">${fN(a.ebitda)}</td><td class="${a.ebitda_final>=0?'pos':'neg'}">${fN(a.ebitda_final)}</td></tr>`}).join('');
  const reparto=`<div class="panel"><h3>Cómo se reparte entre los negocios de juego físico</h3><p class="nota">Cada mes, la Estructura se distribuye entre Slots, Mesas, Poker y Bingo en proporción a sus ingresos de ese mes. Acá se muestran los meses seleccionados sumados.</p><div class="scroll"><table class="tbl simple"><thead><tr><th>Negocio</th><th>Ingresos</th><th>% de ingresos</th><th>Estructura asignada</th><th>% de la Estructura</th><th>EBITDA</th><th>EBITDA final</th></tr></thead><tbody>${filasR}</tbody></table></div></div>`;
  const generico=`<div class="panel"><h3>Casino genérico (centro 01000)</h3>${Math.abs(gen)>0.5?`<p class="nota">Se reparte entre Slots y Mesas según sus ingresos.</p><table class="tbl simple"><thead><tr><th>Total del período</th>${Object.keys(genRep).map(s=>`<th>${s}</th>`).join('')}</tr></thead><tbody><tr><td class="tt">${fN(gen)} M</td>${Object.values(genRep).map(v=>`<td>${fN(v)} M</td>`).join('')}</tr></tbody></table>`:'<p class="nota">En el período no quedó ningún importe para repartir en este centro.</p>'}</div>`;
  const et=porMes.map(x=>MESES[x.m-1]);
  const graf=chartBarras({titulo:'Estructura por mes (millones de $)',etq:et,series:[{n:'Estructura',c:'#f2731a',v:porMes.map(x=>x.est)}]})+
    chartLinea({titulo:'Estructura sobre ingresos del Casino',etq:et,series:[{n:'% de ingresos',c:'#f2731a',v:porMes.map(x=>pctDe(x.est,x.ing))}]});
  const comp=explorador(ms,total);
  const simples=`<div class="charts2">${tablaSimple('Qué la compone: por rubro',rub,k=>{const [c,ch]=k.split('|');return c===ch?bonito(c):bonito(c)+' › '+bonito(ch)})}${tablaSimple('Qué la compone: por gerencia',ger,k=>nombres[k]||k)}</div>`;
  return kpis+`<div class="charts">${graf}</div>`+renderPareto(ms)+(comp===null?'<p class="nota">Para navegar hasta el proveedor, subí <code>estructura_proveedores.json</code> a <code>public/data</code>.</p>'+simples:comp)+reparto+
    (Object.keys(cen).length>1?tablaSimple('Por centro de coste',cen,k=>centros[k]||k):'')+generico;
}


/* ---------- Pareto de gastos de Estructura, con detalle por proveedor ---------- */
S.pgGer='*';S.pgVer='todo';S.pgHab='*';S.pgBus='';S.pgMs=[];S.pgMeses=false;
let PGD=null,PGFOCO=null;
const fN2=v=>{const m=v/1e6,a=Math.abs(m),d=a>=100?0:(a>=10?1:2);return m.toLocaleString('es-AR',{minimumFractionDigits:d,maximumFractionDigits:d})};
function pgCalcular(ms){
  const nm=ms.length,mapa=new Map();let sinProv=0;
  ms.forEach((m,i)=>{for(const r of (PROV.meses[clave(S.anio,m)]||[])){
    const [g,c2,cta,prov,imp]=r;
    if(prov.startsWith('Sin proveedor')){sinProv+=imp;continue}
    const k=g+'|'+cta+'|'+prov;let o=mapa.get(k);
    if(!o){o={k,g,c2,cta,prov,m:new Array(nm).fill(0)};mapa.set(k,o)}
    o.m[i]+=imp}});
  const nMens=Math.ceil(0.8*nm-1e-9),nFrec=Math.ceil(0.4*nm-1e-9),todos=[...mapa.values()];
  for(const o of todos){
    o.tot=suma(o.m);o.n=o.m.filter(v=>v>0).length;
    o.hab=o.n>=nMens?'Mensual':(o.n>=nFrec?'Frecuente':'Ocasional');
    o.men=o.hab==='Mensual'?(o.n?suma(o.m.filter(v=>v>0))/o.n:0):o.tot/nm;
  }
  return {todos,sinProv,nm};
}
function pgVista(){
  const lista=PGD.todos.filter(o=>o.tot>0&&(S.pgGer==='*'||o.g===S.pgGer)).sort((a,b)=>b.tot-a.tot);
  const base=suma(lista.map(o=>o.tot));let cum=0;
  for(const o of lista){o.grupo=cum<0.8*base?'Pareto':'Resto';cum+=o.tot;o.acum=base?cum/base:0;o.pct=base?o.tot/base:0}
  const p=lista.filter(o=>o.grupo==='Pareto'),r=lista.filter(o=>o.grupo==='Resto');
  return {lista,base,p,r,imp80:suma(p.map(o=>o.tot)),imp20:suma(r.map(o=>o.tot)),men80:suma(p.map(o=>o.men)),men20:suma(r.map(o=>o.men))};
}
function pgTabla(){
  const V=pgVista(),nombres=(D.meta&&D.meta.gerencias)||{},ctas=PROV.cuentas||{},q=S.pgBus.trim().toLowerCase();
  let lista=S.pgVer==='80'?V.p:V.lista;

      <td class="cat">${esc(o.prov)}<span class="chev">›</span></td><td>${fN2(o.men)}</td><td class="cat">${esc(bonito(ctas[o.cta]||o.cta))}</td><td>${o.hab}</td><td class="cat">${esc(nombres[o.g]||o.g)}</td>
      <td class="tt">${fN2(o.tot)}</td><td>${fP(o.pct*100)}</td><td>${fP(o.acum*100)}</td><td>${o.grupo}</td></tr>`}).join('');
  const cab='<tr><th>Proveedor</th><th>Importe mensual</th><th>Descripción</th><th>Habitualidad</th><th>Gerencia que origina el Gasto</th><th>Total</th><th>% del total</th><th>% acumulado</th><th>Grupo</th></tr>';
  const cuenta=q?`<p class="nota" style="margin:8px 0 0">Mostrando ${lista.length} de ${total} gastos.</p>`:'';
  return `<div class="scroll pvtope"><table class="tbl pg"><thead>${cab}</thead><tbody>${filas}</tbody></table></div>${cuenta}`;
}
function renderParetoGastos(ms){

    <label>Mostrar</label><div class="seg" role="group" aria-label="Porcentaje del gasto"><button type="button" id="pgv80" aria-pressed="${S.pgVer==='80'}">80%</button><button type="button" id="pgv100" aria-pressed="${S.pgVer!=='80'}">100%</button></div>

  const habs=`<div class="pvbar"><label>Habitualidad</label><div class="seg" role="group" aria-label="Habitualidad del gasto"><button type="button" class="pghab" data-h="*" aria-pressed="${S.pgHab==='*'}">Todas · ${vista.length}</button>${hb.map(x=>`<button type="button" class="pghab" data-h="${x.h}" aria-pressed="${S.pgHab===x.h}" title="${fM(x.men)} por mes">${x.h} · ${x.n}</button>`).join('')}</div></div>`;
  return `${kpis}<div class="panel"><h3>Gastos de Estructura – Pareto 80/20${S.pgGer!=='*'?' · '+esc(nombres[S.pgGer]||S.pgGer):''}</h3>
    <p class="nota">Tocá un gasto para ver el listado de ese proveedor: cuenta, tipo de gasto, gerencia, monto y facturas. ${S.pgGer==='*'?'':'El 80/20 se calcula dentro de esta gerencia. '}${notas.join(' ')}</p>
    ${sel}${habs}<div id="pgtabla">${pgTabla()}</div></div>`;
}
/* ---------- Facturas (documentos) ---------- */
let DOCS=null,DOCIDX=null;
function cargarDocs(){
  if(DOCS!==null)return;DOCS='cargando';

    .then(j=>{DOCS=j;DOCIDX=null;refrescarDetalle()})

function docIndex(){
  if(DOCIDX)return DOCIDX;DOCIDX=new Map();
  for(const [mes,filas] of Object.entries(DOCS.meses))for(const r of filas){
    const k=r[1]+'|'+DOCS.cuentas[r[2]]+'|'+DOCS.provs[r[0]];
    if(!DOCIDX.has(k))DOCIDX.set(k,[]);
    DOCIDX.get(k).push({mes,dia:r[3],doc:r[4],clase:r[5],imp:r[6]});
  }
  return DOCIDX;
}
const docsListos=()=>DOCS&&DOCS!=='cargando'&&DOCS!=='error';
function facturasDe(o){
  if(!docsListos())return null;

  return (docIndex().get(o.g+'|'+o.cta+'|'+o.prov)||[]).filter(x=>set.has(x.mes)).sort((a,b)=>a.mes<b.mes?1:(a.mes>b.mes?-1:b.dia-a.dia));

const fPes=v=>v.toLocaleString('es-AR',{maximumFractionDigits:0});

    <p class="nota">Proveedores (gastos) ordenados por monto. Tocá un proveedor para ver sus facturas. ${NOTA_TEXTO}</p>
    <div class="kpis dk"><div class="kpi"><span>Gasto del ${etqModo.toLowerCase()}</span><b>${fM(V.base)}</b></div><div class="kpi"><span>Proveedores en el 80%</span><b>${V.p.length} <small>de ${V.lista.length}</small></b></div><div class="kpi"><span>${S.ndVer==='80'?'Importe del 80%':'Importe del 100%'}</span><b>${fM(imp)}</b><small>${fM(men)} por mes</small></div></div>
    <div class="pvbar"><label>Mostrar</label><div class="seg" role="group" aria-label="Porcentaje del gasto"><button type="button" id="ndv80" aria-pressed="${S.ndVer==='80'}">80%</button><button type="button" id="ndv100" aria-pressed="${S.ndVer!=='80'}">100%</button></div></div>
    ${notaDocs()}
    <div class="scroll"><table class="tbl pgd nd"><thead><tr><th>Proveedor</th><th>Descripción</th><th>Rubro</th><th>Gerencia que origina el Gasto</th><th>Importe mensual</th><th>Total</th><th>Facturas</th></tr></thead><tbody>${filas||'<tr><td colspan="7" class="vacio">Sin gastos.</td></tr>'}</tbody></table></div>
    <p class="nota" style="margin-top:10px">Millones de $. Importe mensual: los Ocasionales y Frecuentes se reparten en los meses del período; los Mensuales son el promedio de los meses con gasto.</p>`;
}
function mostrarDrawer(fila){
  const d=$('pgdet');d.hidden=false;$('pgback').hidden=false;document.body.style.overflow='hidden';
  PGFOCO=fila||PGFOCO;$('pgcerrar')&&$('pgcerrar').focus();
}
function abrirNodo(modo,raw,label,fila){
  S.pgMs=S.pvMs;PGD=pgCalcular(S.pgMs);S.nd={modo,raw,label};S.ndVer='80';S.ndExp=new Set();
  cargarDocs();$('pgdet').dataset.vista='nodo';pintarNodo();mostrarDrawer(fila);
}
function refrescarDetalle(){
  const d=$('pgdet');if(!d||d.hidden)return;
  if(d.dataset.vista==='nodo')pintarNodo();else if(d.dataset.vista==='prov')abrirDetalle(d.dataset.p,d.dataset.k,PGFOCO,true);
}

/* ---------- Detalle de un proveedor ---------- */
function abrirDetalle(prov,k,fila,silencioso){
  const ctas=PROV.cuentas||{},nombres=(D.meta&&D.meta.gerencias)||{},nm=PGD.nm;
  cargarDocs();
  const L=PGD.todos.filter(o=>o.prov===prov).sort((a,b)=>b.tot-a.tot),tot=suma(L.map(o=>o.tot));
  const mesTot=S.pgMs.map((m,i)=>suma(L.map(o=>o.m[i])));
  const et=S.pgMs.map(m=>MESES[m-1]);
  const celM=o=>S.pgMeses?o.m.map(v=>`<td>${v?fN2(v):'–'}</td>`).join(''):'';
  const filas=L.map(o=>`<tr class="${o.k===k?'sel':''}"><td class="cat">${esc(o.cta)} · ${esc(bonito(ctas[o.cta]||''))}</td><td class="cat">${esc(bonito(o.c2))}</td><td class="cat">${esc(nombres[o.g]||o.g)}</td>${celM(o)}<td class="tt ${o.tot<0?'neg':''}">${fN2(o.tot)}</td></tr>`).join('');
  const cab=`<tr><th>Cuenta</th><th>Tipo de gasto</th><th>Gerencia</th>${S.pgMeses?et.map(x=>`<th>${x}</th>`).join(''):''}<th>Monto</th></tr>`;
  const pie=`<tr class="g"><td>Total del proveedor</td><td></td><td></td>${S.pgMeses?mesTot.map(v=>`<td>${v?fN2(v):'–'}</td>`).join(''):''}<td class="tt">${fN2(tot)}</td></tr>`;
  const conGasto=mesTot.filter(v=>v>0).length;
  let fact='';
  if(docsListos()){
    const fs=[];
    for(const o of L)for(const x of (facturasDe(o)||[]))fs.push({...x,cta:o.cta,g:o.g});
    fs.sort((a,b)=>a.mes<b.mes?1:(a.mes>b.mes?-1:b.dia-a.dia));
    const fl=fs.map(x=>`<tr><td class="cat">${fFecha(x)}</td><td class="cat">${esc(x.doc||'–')}</td><td class="cat">${esc(tipoDoc(x.clase))}</td><td class="cat">${esc(x.cta)}</td><td class="cat">${esc(nombres[x.g]||x.g)}</td><td class="${x.imp<0?'neg':''}">${fPes(x.imp)}</td></tr>`).join('');
    fact=`<h3 style="margin:18px 0 8px;font-size:14px">Facturas del período (${fs.length})</h3><div class="scroll pvtope"><table class="tbl pgd fac"><thead><tr><th>Fecha</th><th>N° de documento</th><th>Tipo de documento</th><th>Cuenta</th><th>Gerencia</th><th>Importe ($)</th></tr></thead><tbody>${fl}</tbody></table></div><p class="nota" style="margin-top:8px">${NOTA_TEXTO}</p>`;
  }else fact=notaDocs();
  const d=$('pgdet');
  d.innerHTML=`<div class="dh"><div><small>Proveedor</small><h2 id="pgdet-t">${esc(prov)}</h2></div><button type="button" class="dx" id="pgcerrar" aria-label="Cerrar el detalle">×</button></div>
    <div class="kpis dk"><div class="kpi"><span>Total del período</span><b>${fM(tot)}</b></div><div class="kpi"><span>Meses con gasto</span><b>${conGasto} <small>de ${nm}</small></b></div><div class="kpi"><span>Gastos del proveedor</span><b>${L.length} <small>${L.length===1?'cuenta':'cuentas'}</small></b></div></div>
    <div class="pvbar"><label class="chk"><input type="checkbox" id="pgmeses"${S.pgMeses?' checked':''}> Ver meses</label></div>
    <div class="scroll"><table class="tbl pgd"><thead>${cab}</thead><tbody>${filas}${pie}</tbody></table></div>
    <p class="nota" style="margin-top:10px">Millones de $. Incluye todas las gerencias donde figura este proveedor en el período (la fila marcada es el gasto que tocaste).</p>
    ${fact}
    ${chartBarras({titulo:'Importe por mes (millones de $)',etq:et,series:[{n:'Monto',c:'#f2731a',v:mesTot}]})}`;
  d.dataset.vista='prov';d.dataset.p=prov;d.dataset.k=k||'';
  if(!silencioso)mostrarDrawer(fila);
}
function cerrarDetalle(){
  const d=$('pgdet');if(!d||d.hidden)return;
  d.hidden=true;$('pgback').hidden=true;document.body.style.overflow='';
  if(PGFOCO&&document.body.contains(PGFOCO))PGFOCO.focus();PGFOCO=null;
}

/* ---------- controles de interfaz ---------- */
function llenarMeses(){
  const ms=mesesDe(D.meses,S.anio);
  if(!ms.includes(S.desde)||!ms.includes(S.hasta)){S.desde=ms[0];S.hasta=ms[ms.length-1]}
  const op=ms.map(m=>`<option value="${m}">${MESES[m-1]}</option>`).join('');
  $('desde').innerHTML=op;$('hasta').innerHTML=op;
  $('desde').value=S.desde;$('hasta').value=S.hasta;
}
/* ---------- Panel lateral ---------- */
const ICONOS={
 'Resumen':'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 'Casino':'<rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><circle cx="8.5" cy="8.5" r="1" fill="currentColor"/><circle cx="15.5" cy="8.5" r="1" fill="currentColor"/><circle cx="12" cy="12" r="1" fill="currentColor"/><circle cx="8.5" cy="15.5" r="1" fill="currentColor"/><circle cx="15.5" cy="15.5" r="1" fill="currentColor"/>',
 'Casino Online':'<rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4M10.5 7.8v4.4l3.8-2.2z"/>',
 'Hotel':'<path d="M3 19V6M3 15h18v4M21 15v-3a3 3 0 0 0-3-3h-7v6"/><circle cx="7" cy="11" r="1.6"/>',
 'AA&BB':'<path d="M7 3v7a2 2 0 0 0 2 2v9M11 3v7a2 2 0 0 1-2 2M7 3v6M17 21V3c-2.2 1.4-3.5 4-3.5 7v2H17"/>',
 'Parking':'<rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><path d="M9.5 17V7.5h3.2a2.9 2.9 0 0 1 0 5.8H9.5"/>',
 'Otros Negocios':'<rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2M3 13h18"/>',
 'Evolución':'<path d="M3 17l6-6 4 4 8-8M15 7h6v6"/>',
 'Rubros':'<path d="M9 6h12M9 12h12M9 18h12M4 6h.01M4 12h.01M4 18h.01"/>',
 'Gerencias':'<circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M17 14.2a5 5 0 0 1 4 5.8"/>',
 'Pareto':'<rect x="3" y="4" width="4.5" height="16" rx="1"/><rect x="10" y="9" width="4.5" height="11" rx="1"/><rect x="17" y="14" width="4.5" height="6" rx="1"/>',
 'Estructura':'<rect x="9" y="3" width="6" height="5" rx="1"/><rect x="3" y="16" width="6" height="5" rx="1"/><rect x="15" y="16" width="6" height="5" rx="1"/><path d="M12 8v4M6 16v-4h12v4"/>'
};
const icono=t=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONOS[t]||ICONOS['Otros Negocios']}</svg>`;
const esMovil=()=>window.matchMedia('(max-width:760px)').matches;
function aplicarPanel(){
  const h=S.sbOculto;
  $('sb').classList.toggle('hidden',h);$('shell').classList.toggle('nosb',h);
  $('sbtoggle').setAttribute('aria-label',h?'Mostrar panel':'Ocultar panel');
  $('sbtoggle').setAttribute('aria-expanded',String(!h));
  $('backdrop').hidden=!(esMovil()&&!h);
  if(!esMovil()){try{localStorage.setItem('cdg.panel',h?'oculto':'visible')}catch(e){}}
}
function iniciarPanel(){
  let g=null;try{g=localStorage.getItem('cdg.panel')}catch(e){}
  S.sbOculto=esMovil()?true:g==='oculto';
  $('sb').hidden=false;aplicarPanel();
}
$('sbtoggle').addEventListener('click',()=>{S.sbOculto=!S.sbOculto;aplicarPanel()});
$('backdrop').addEventListener('click',()=>{S.sbOculto=true;aplicarPanel()});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&!$('pgdet').hidden){cerrarDetalle();return}
  if(e.key==='Escape'&&esMovil()&&!S.sbOculto){S.sbOculto=true;aplicarPanel()}
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('pgfila')){e.preventDefault();abrirDetalle(e.target.dataset.p,e.target.dataset.k,e.target)}
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('pvnodo')){e.preventDefault();abrirNodo(S.pvModo,e.target.dataset.n,e.target.dataset.l,e.target)}
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('ndfila')){e.preventDefault();const k=e.target.dataset.k;S.ndExp.has(k)?S.ndExp.delete(k):S.ndExp.add(k);pintarNodo()}
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('pvprov')){e.preventDefault();S.pgMs=S.pvMs;PGD=pgCalcular(S.pgMs);abrirDetalle(e.target.dataset.p,null,e.target)}
});
$('pgback').addEventListener('click',cerrarDetalle);
$('pgdet').addEventListener('click',e=>{
  if(e.target.closest('#pgcerrar')){cerrarDetalle();return}
  if(e.target.id==='pgmeses'){S.pgMeses=e.target.checked;abrirDetalle($('pgdet').dataset.p,$('pgdet').dataset.k,PGFOCO,true);return}
  if(e.target.id==='ndv80'||e.target.id==='ndv100'){S.ndVer=e.target.id==='ndv80'?'80':'100';pintarNodo();return}
  const f=e.target.closest('tr.ndfila');
  if(f){const k=f.dataset.k;S.ndExp.has(k)?S.ndExp.delete(k):S.ndExp.add(k);pintarNodo()}
});
$('sbitems').addEventListener('click',e=>{
  const b=e.target.closest('.sb-item');if(!b)return;
  S.tab=b.dataset.t;tabs();render();
  if(esMovil()){S.sbOculto=true;aplicarPanel()}
});

function tabs(){
  const lista=['Resumen',...unidadesPresentes()];
  if(!lista.includes(S.tab)&&!ANALISIS.includes(S.tab))S.tab='Resumen';
  const btn=t=>`<button class="sb-item" data-t="${esc(t)}" title="${esc(t)}"${t===S.tab?' aria-current="page"':''}>${icono(t)}<span class="lb">${esc(t)}</span></button>`;
  const sec=n=>`<div class="sb-sec" aria-hidden="true"><span>${n}</span></div>`;
  $('sbitems').innerHTML=sec('Unidades')+lista.map(btn).join('')+sec('Análisis')+ANALISIS.map(btn).join('');
}

function iniciar(){
  const ys=anios();
  S.anio=ys[0];
  $('anio').innerHTML=ys.map(y=>`<option>${y}</option>`).join('');
  $('anio').value=S.anio;
  llenarMeses();tabs();
  $('filtros').hidden=false;iniciarPanel();
  $('sub').textContent='City Center Rosario · '+S.anio;
  const ult=Object.keys(D.meses).sort().pop();
  const f=D.meta&&D.meta.actualizado?new Date(D.meta.actualizado).toLocaleString('es-AR',{dateStyle:'short',timeStyle:'short'}):'';
  $('pie').textContent=`Importes en millones de pesos (ARS). Último mes cargado: ${MESES[+ult.slice(5)-1]} ${ult.slice(0,4)}${f?' · Actualizado '+f:''}`;
  render();
}

$('anio').addEventListener('change',e=>{S.anio=+e.target.value;$('sub').textContent='City Center Rosario · '+S.anio;llenarMeses();tabs();render()});
$('desde').addEventListener('change',e=>{S.desde=+e.target.value;if(S.hasta<S.desde){S.hasta=S.desde;$('hasta').value=S.hasta}render()});
$('hasta').addEventListener('change',e=>{S.hasta=+e.target.value;if(S.desde>S.hasta){S.desde=S.hasta;$('desde').value=S.desde}render()});

$('contenido').addEventListener('change',e=>{
  if(e.target.id==='ambito'){S.ambito=e.target.value;render()}
  if(e.target.id==='gconc'){S.gConc=e.target.value;render()}
});
$('contenido').addEventListener('input',e=>{if(e.target.id==='pgbus'){S.pgBus=e.target.value;$('pgtabla').innerHTML=pgTabla()}if(e.target.id==='pvbus'){S.pvBus=e.target.value;$('pvtabla').innerHTML=pvHTML()}});
$('contenido').addEventListener('change',e=>{
  if(e.target.id==='pggerencia'){S.pgGer=e.target.value;render()}
  if(e.target.id==='parmodo'){S.pareto=e.target.value;if(S.pareto==='rubro')S.parRubro='*';render()}
  if(e.target.id==='parrubro'){S.parRubro=e.target.value;render()}
  if(e.target.id==='pvmodo'){S.pvModo=e.target.value;S.pvExp.clear();render()}
  if(e.target.id==='pvmeses'){S.pvMeses=e.target.checked;$('pvtabla').innerHTML=pvHTML()}
});
$('contenido').addEventListener('click',e=>{
  if(e.target.id==='pgv80'||e.target.id==='pgv100'){S.pgVer=e.target.id==='pgv80'?'80':'todo';render();return}
  const hb=e.target.closest('.pghab');
  if(hb){S.pgHab=hb.dataset.h;render();return}
  const fr=e.target.closest('tr.pgfila');
  if(fr){abrirDetalle(fr.dataset.p,fr.dataset.k,fr);return}
  const pb=e.target.closest('.parbar');
  if(pb&&pb.dataset.k){S.pareto='proveedor';S.parRubro=pb.dataset.k;render();return}
  const x=e.target.closest('.pvx');
  if(x){const k=x.dataset.k;S.pvExp.has(k)?S.pvExp.delete(k):S.pvExp.add(k);$('pvtabla').innerHTML=pvHTML();return}
  const nd=e.target.closest('tr.pvnodo');
  if(nd){abrirNodo(S.pvModo,nd.dataset.n,nd.dataset.l,nd);return}
  const pp=e.target.closest('tr.pvprov');
  if(pp){S.pgMs=S.pvMs;PGD=pgCalcular(S.pgMs);abrirDetalle(pp.dataset.p,null,pp);return}
  const pr=e.target.closest('tr.pvrow');
  if(pr){const k=pr.dataset.k;S.pvExp.has(k)?S.pvExp.delete(k):S.pvExp.add(k);$('pvtabla').innerHTML=pvHTML();return}
  if(e.target.id==='pvabrir'){S.pvExp=new Set(pvClaves(pvArbol(),'',[]));$('pvtabla').innerHTML=pvHTML();return}
  if(e.target.id==='pvcerrar'){S.pvExp.clear();$('pvtabla').innerHTML=pvHTML();return}
  const b=e.target.closest('.exp')||e.target.closest('tr.exprow');if(!b)return;
  const k=b.dataset.k;S.exp.has(k)?S.exp.delete(k):S.exp.add(k);render();
});

cargarJSON('data/acumulado.json',window.CDG_DATA)
  .then(j=>{D=j;if(!D.meses||!Object.keys(D.meses).length)throw new Error('vacío');iniciar()})
  .catch(()=>{$('contenido').innerHTML='<div class="estado"><strong>No hay datos para mostrar</strong>Falta el archivo <code>public/data/acumulado.json</code> o está vacío. Procesá una bajada con <code>procesar_mes.py</code> y volvé a publicar.</div>'});
</script>

</html>
